name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt pytest
      - name: Pytest (file + sqlite 回归)
        run: pytest
