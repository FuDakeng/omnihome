services:
  omnihome:
    build: .
    image: omnihome:latest
    container_name: omnihome
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 用户数据空间（笔记 / 书签 / 偏好 / 备份）持久化（后端按相对路径解析到 /app/data）
      - ./data:/app/data
      # 如需「系统监控」页读取宿主机 Docker 容器状态，取消下面一行注释后重建容器：
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # 只读挂载宿主根。不挂这一项时，存储/网络指标会退回容器视角，页面显示「—」而不是整机容量。
      - /:/host:ro
    environment:
      - TZ=Asia/Shanghai
