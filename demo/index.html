<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f15">
<title>万事屋 · 个人门户</title>
<link rel="stylesheet" href="css/theme.css?v=__VER__">
<link rel="stylesheet" href="css/layout.css?v=__VER__">
<link rel="stylesheet" href="css/components/base.css?v=__VER__">
<link rel="stylesheet" href="css/components/weather.css?v=__VER__">
<link rel="stylesheet" href="css/components/monitor.css?v=__VER__">
<link rel="stylesheet" href="css/components/widgets.css?v=__VER__">
<link rel="stylesheet" href="css/components/notes.css?v=__VER__">
<link rel="stylesheet" href="css/components/toolbox.css?v=__VER__">
<link rel="stylesheet" href="css/components/overlays.css?v=__VER__">
<link rel="stylesheet" href="css/components/kb.css?v=__VER__">
<link rel="stylesheet" href="css/components/pages.css?v=__VER__">
<link rel="stylesheet" href="css/mobile.css?v=__VER__">
<script src="js/theme-boot.js?v=__VER__"></script>
</head>
<body>

<!-- 启动遮罩：登录态校验完成前覆盖首屏。
     之前 #authScreen 默认带 open，已登录用户每次刷新都会先看到登录页再跳转。 -->
<div class="boot-splash" id="bootSplash">
  <svg class="ic boot-mark"><use href="#i-logo"/></svg>
  <div class="boot-bar"><i></i></div>
</div>

<!--ICONS-->
<div class="app">
  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar">
    <div class="sb-top">
      <div class="logo">
        <div class="logo-mark"><svg class="ic ic-fill"><use href="#i-logo"/></svg></div>
        <div class="logo-text">
          <div class="logo-name">万事屋</div>
          <div class="logo-sub">OMNIHOME · PERSONAL HUB</div>
        </div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-group">
        <div class="nav-title">总览</div>
        <button class="nav-item active" data-nav="dashboard" data-title="仪表盘">
          <svg class="ic nav-ic"><use href="#i-home"/></svg><span class="nav-label">仪表盘</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-title">功能模块</div>
        <button class="nav-item" data-nav="monitor" data-title="系统监控">
          <svg class="ic nav-ic"><use href="#i-activity"/></svg><span class="nav-label">系统监控</span>
        </button>
        <button class="nav-item" data-nav="bookmarks" data-title="快捷导航">
          <svg class="ic nav-ic"><use href="#i-bookmark"/></svg><span class="nav-label">快捷导航</span>
        </button>
        <button class="nav-item" data-nav="vault" data-title="密码保险库">
          <svg class="ic nav-ic"><use href="#i-shield"/></svg><span class="nav-label">密码保险库</span>
          <span class="nav-badge" id="vaultBadge" style="display:none"></span>
        </button>
        <button class="nav-item" data-nav="notes" data-title="知识库">
          <svg class="ic nav-ic"><use href="#i-book"/></svg><span class="nav-label">知识库</span>
        </button>
        <button class="nav-item" data-nav="toolbox" data-title="实用工具箱">
          <svg class="ic nav-ic"><use href="#i-wrench"/></svg><span class="nav-label">实用工具箱</span>
        </button>
      </div>
    </nav>

    <div class="sb-foot">
      <button class="user-chip" data-open-settings>
        <span class="avatar online">JL</span>
        <span class="user-meta">
          <span class="user-name">Jean Law</span>
          <span class="user-plan">管理员 · 在线</span>
        </span>
        <svg class="ic chev" style="width:14px;height:14px;color:var(--om-text-3)"><use href="#i-chev-d"/></svg>
      </button>
    </div>
  </aside>

  <!-- ==================== 主区域 ==================== -->
  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" id="collapseBtn" title="折叠侧边栏">
          <svg class="ic collapse-desktop"><use href="#i-chevs-l"/></svg>
          <svg class="ic collapse-phone"><use href="#i-menu"/></svg>
        </button>
        <span class="crumb-title" id="crumbTitle">仪表盘</span>
        <span class="crumb-date num" id="crumbDate">…</span>
      </div>

      <!-- 全局搜索 -->
      <div class="searchbar">
        <div class="search-field">
          <svg class="ic"><use href="#i-search"/></svg>
          <input type="text" id="globalSearch" placeholder="全局搜索：网址 / 笔记 / 密码 / 网页…" autocomplete="off" enterkeyhint="search">
          <span class="kbd">⌘ K</span>
        </div>
        <button type="button" class="search-cancel" id="searchCancel">取消</button>
        <div class="search-pop">
          <div class="sp-label">搜索引擎跳转</div>
          <div class="sp-row">
            <button class="engine-chip on">Google</button>
            <button class="engine-chip">Bing</button>
            <button class="engine-chip">DuckDuckGo</button>
            <button class="engine-chip">百度</button>
            <button class="engine-chip">站内检索</button>
          </div>
          <div class="sp-label sp-recent-head" id="spRecentHead" style="margin-top:12px">最近搜索
            <span class="sp-recent-ops">
              <button class="sp-op" id="spRecentHide" title="隐藏搜索历史（可随时恢复显示）">隐藏</button>
              <button class="sp-op" id="spRecentClear" title="清空全部搜索历史">清除</button>
            </span>
          </div>
          <div id="spRecent"></div>
          <div id="spResultsWrap" hidden>
            <div class="sp-label" style="margin-top:12px">站内结果</div>
            <div id="spResults"></div>
          </div>
          <div class="sp-foot"><span>回车使用当前引擎</span><span>Tab 切换引擎</span></div>
        </div>
      </div>

      <div class="tb-right">
        <button class="icon-btn" id="searchToggle" title="搜索"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="themeToggle" title="切换明暗模式">
          <svg class="ic" data-ic="light" style="display:none"><use href="#i-sun"/></svg>
          <svg class="ic" data-ic="dark"><use href="#i-moon"/></svg>
        </button>
        <button class="icon-btn" id="bellBtn" title="通知">
          <svg class="ic"><use href="#i-bell"/></svg>
          <span class="inbox-dot" id="inboxDot" hidden></span>
        </button>
        <div class="inbox-panel" id="inboxPanel" hidden>
          <div class="inbox-head">通知</div>
          <div class="inbox-list" id="inboxList"><div class="kb-empty">暂无通知</div></div>
        </div>
        <div class="menu-wrap">
          <button class="icon-btn" id="avatarBtn" style="padding:0;width:auto;background:none" title="用户菜单">
            <span class="avatar online">JL</span>
          </button>
          <div class="menu" id="userMenu">
            <div class="menu-head">
              <span class="avatar">JL</span>
              <div><div class="user-name">Jean Law</div><div class="user-plan">jean@nas.local</div></div>
            </div>
            <button class="menu-item" data-open-settings><svg class="ic"><use href="#i-user"/></svg>个人中心</button>
            <button class="menu-item" data-open-settings><svg class="ic"><use href="#i-gear"/></svg>设置中心</button>
            <button class="menu-item" data-open-settings><svg class="ic"><use href="#i-palette"/></svg>主题与外观</button>
            <button class="menu-item" data-open-switch><svg class="ic"><use href="#i-users"/></svg>切换用户</button>
            <div class="menu-div"></div>
            <button class="menu-item danger" id="logoutBtn"><svg class="ic"><use href="#i-logout"/></svg>退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <!--VIEWS-->
    </main>
  </div>

  <button type="button" class="nav-scrim" id="navScrim" aria-label="关闭菜单"></button>
</div>

<!--OVERLAYS-->
<!-- Markdown / QR：本地 vendor；应用以原生 ESM 启动。 -->
<script src="js/vendor/marked.min.js?v=__VER__"></script>
<script src="js/vendor/purify.min.js?v=__VER__"></script>
<script src="js/vendor/qrcode.min.js?v=__VER__"></script>
<script type="module" src="js/boot.js?v=__VER__"></script>
</body>
</html>
