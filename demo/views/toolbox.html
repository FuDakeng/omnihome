      <!-- ==================== 视图：实用工具箱 ==================== -->
      <section class="view" data-view="toolbox">
        <div class="view-head">
          <div>
            <h2 class="vh-title">实用工具箱</h2>
            <div class="vh-sub">日常小工具集合 · 全部本地运行，数据不出内网</div>
          </div>
        </div>

        <div class="grid12">
          <!-- 翻译 -->
          <article class="card col-8" data-tool="translate">
            <div class="card-head">
              <h3 class="card-title"><svg class="ic"><use href="#i-globe"/></svg>翻译</h3>
              <span class="chip no-dot">多引擎加速</span>
            </div>
            <div class="card-pad">
              <div class="trans-lang">
                <select class="lang-select" data-tr="from"><option>中文</option><option>English</option><option>日本語</option><option>한국어</option></select>
                <button class="icon-btn" data-tr="swap" title="交换语言"><svg class="ic"><use href="#i-swap"/></svg></button>
                <select class="lang-select" data-tr="to"><option>中文</option><option selected>English</option><option>日本語</option><option>한국어</option></select>
                <button class="btn btn-primary btn-sm" data-tr="go" style="margin-left:auto"><svg class="ic"><use href="#i-zap"/></svg>翻译</button>
              </div>
              <div class="t-panes">
                <div class="t-pane">
                  <textarea data-tr="src" placeholder="输入要翻译的文本…">自托管的最大乐趣，在于数据完全掌握在自己手中。</textarea>
                  <div style="font-size:11px;color:var(--om-text-3);margin-top:8px" class="num" data-tr="count">0 / 5000</div>
                </div>
                <div class="t-pane result" data-tr="out"><span>译文将显示在这里，点击「翻译」开始。</span><div style="margin-top:8px;display:flex;gap:4px">
                    <button class="icon-btn-xs" data-tr="copy" title="复制"><svg class="ic"><use href="#i-copy"/></svg></button>
                    <button class="icon-btn-xs" data-tr="speak" title="朗读"><svg class="ic"><use href="#i-volume"/></svg></button>
                  </div>
                </div>
              </div>
            </div>
          </article>

          <!-- 强密码生成 -->
          <article class="card col-4" data-tool="passgen">
            <div class="card-head">
              <h3 class="card-title"><svg class="ic"><use href="#i-key"/></svg>强密码生成</h3>
            </div>
            <div class="card-pad">
              <div class="pg-out">
                <span class="num" data-pg="out"></span>
                <button class="icon-btn-xs" data-pg="copy" title="复制"><svg class="ic"><use href="#i-copy"/></svg></button>
                <button class="icon-btn-xs" data-pg="regen" title="重新生成"><svg class="ic"><use href="#i-refresh"/></svg></button>
              </div>
              <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
                <span class="strength" data-pg="strength" style="flex:1"><i style="width:auto;flex:1"></i><i style="width:auto;flex:1"></i><i style="width:auto;flex:1"></i><i style="width:auto;flex:1"></i></span>
                <span style="font-size:11px;color:var(--om-text-3);font-weight:600" data-pg="strength-lbl">—</span>
              </div>
              <div class="pg-row"><span>密码长度</span><b class="num" data-pg="len-val">16</b></div>
              <input type="range" class="range" data-pg="len" min="8" max="32" value="16">
              <div class="pg-checks">
                <label class="checkbox"><input type="checkbox" data-pg="upper" checked><span class="box"></span>大写字母</label>
                <label class="checkbox"><input type="checkbox" data-pg="lower" checked><span class="box"></span>小写字母</label>
                <label class="checkbox"><input type="checkbox" data-pg="digit" checked><span class="box"></span>数字</label>
                <label class="checkbox"><input type="checkbox" data-pg="symbol" checked><span class="box"></span>特殊符号</label>
              </div>
              <button class="btn btn-primary" data-pg="go" style="width:100%;margin-top:14px"><svg class="ic"><use href="#i-refresh"/></svg>生成新密码</button>
            </div>
          </article>

          <!-- 提示词增强 -->
          <article class="card col-12" data-tool="prompt">
            <div class="card-head">
              <h3 class="card-title"><svg class="ic"><use href="#i-pen"/></svg>提示词增强</h3>
              <div class="pe-head-actions">
                <button class="pe-lib-btn" id="peHistoryBtn" type="button"><svg class="ic"><use href="#i-clock"/></svg><span>历史</span> <b class="num" id="peHistoryCount">0</b></button>
                <button class="pe-lib-btn" id="peFavBtn" type="button"><svg class="ic"><use href="#i-star"/></svg><span>收藏</span> <b class="num" id="peFavCount">0</b></button>
              </div>
            </div>
            <div class="card-pad pe-body">
              <div class="pe-templates" id="peTemplates">
                <button class="pe-tpl" type="button" data-template="coding">
                  <span class="pe-tpl-ic"><svg class="ic"><use href="#i-code"/></svg></span>
                  <span class="pe-tpl-text"><b>代码生成</b><small>性能、测试与错误处理</small></span>
                </button>
                <button class="pe-tpl" type="button" data-template="writing">
                  <span class="pe-tpl-ic"><svg class="ic"><use href="#i-pen"/></svg></span>
                  <span class="pe-tpl-text"><b>文案创作</b><small>吸引眼球、SEO 与标题候选</small></span>
                </button>
                <button class="pe-tpl" type="button" data-template="data">
                  <span class="pe-tpl-ic"><svg class="ic"><use href="#i-table"/></svg></span>
                  <span class="pe-tpl-text"><b>数据分析</b><small>可视化建议与趋势解读</small></span>
                </button>
                <button class="pe-tpl" type="button" data-template="academic">
                  <span class="pe-tpl-ic"><svg class="ic"><use href="#i-book"/></svg></span>
                  <span class="pe-tpl-text"><b>学术研究</b><small>权威引用与严密论证</small></span>
                </button>
              </div>

              <div class="pe-lib" id="peLib" hidden>
                <div class="pe-lib-head">
                  <b id="peLibTitle">历史记录</b>
                  <span id="peLibHint">仅保存在本机</span>
                  <button class="pe-link" id="peLibClear" type="button">清空</button>
                </div>
                <div class="pe-lib-list" id="peLibList"></div>
              </div>

              <div class="pe-cols">
                <section class="pe-col">
                  <div class="pe-col-head">
                    <span>原始提示词</span>
                    <span class="pe-count num" id="peCount">0 / 2000</span>
                  </div>
                  <textarea class="pe-input" id="peInput" maxlength="2000" spellcheck="false" placeholder="例如：检查日志，排查解决运行时崩溃的问题"></textarea>
                  <div class="pe-quick">
                    <span>Ctrl / ⌘ + Enter 快速增强</span>
                  </div>
                </section>

                <section class="pe-col">
                  <div class="pe-col-head">
                    <span>增强结果</span>
                    <span class="chip primary no-dot pe-mode" id="peMode" hidden>本地模板</span>
                  </div>
                  <div class="pe-out" id="peOut" tabindex="0"><span class="pe-empty">增强结果会显示在这里</span></div>
                  <div class="pe-missing" id="peMissing" hidden></div>
                  <div class="pe-result-actions">
                    <button class="icon-btn-xs" id="peCopy" type="button" title="复制"><svg class="ic"><use href="#i-copy"/></svg></button>
                    <button class="icon-btn-xs" id="peFav" type="button" title="收藏"><svg class="ic"><use href="#i-star"/></svg></button>
                    <button class="btn btn-outline btn-sm" id="peTest" type="button"><svg class="ic"><use href="#i-zap"/></svg>测试运行</button>
                    <span class="pe-test-hint" id="peTestHint">发送到你的 AI 接口</span>
                  </div>
                  <div class="pe-test" id="peTestWrap" hidden>
                    <div class="pe-test-head">
                      <b>测试运行</b>
                      <button class="pe-link" id="peTestClose" type="button">收起</button>
                    </div>
                    <div class="pe-test-out" id="peTestOut"></div>
                  </div>
                </section>
              </div>

              <details class="pe-advanced" open>
                <summary>高级配置</summary>
                <div class="pe-opts">
                  <label class="pe-field"><span>场景</span>
                    <select class="lang-select" id="peScene">
                      <option value="auto">自动识别</option>
                      <option value="general">通用</option>
                      <option value="coding">代码生成</option>
                      <option value="writing">文案创作</option>
                      <option value="data">数据分析</option>
                      <option value="academic">学术研究</option>
                      <option value="translation">翻译润色</option>
                    </select>
                  </label>
                  <label class="pe-field"><span>角色设定</span>
                    <select class="lang-select" id="peRole">
                      <option value="auto">自动（按场景）</option>
                      <option value="programmer">程序员</option>
                      <option value="writer">作家</option>
                      <option value="analyst">数据分析师</option>
                      <option value="translator">翻译官</option>
                      <option value="researcher">学术研究者</option>
                      <option value="custom">自定义</option>
                    </select>
                  </label>
                  <label class="pe-field"><span>语气风格</span>
                    <select class="lang-select" id="peTone">
                      <option value="professional">专业严谨</option>
                      <option value="rigorous">批判审慎</option>
                      <option value="concise">简洁明了</option>
                      <option value="friendly">亲切友好</option>
                      <option value="humorous">幽默风趣</option>
                      <option value="creative">创意发散</option>
                    </select>
                  </label>
                  <label class="pe-field"><span>输出格式</span>
                    <select class="lang-select" id="peFormat">
                      <option value="auto">自动</option>
                      <option value="markdown">Markdown 分节</option>
                      <option value="list">分点列表</option>
                      <option value="table">Markdown 表格</option>
                      <option value="json">JSON 格式</option>
                      <option value="code">代码块</option>
                      <option value="plain">自然段</option>
                    </select>
                  </label>
                  <label class="pe-field"><span>回答语言</span>
                    <select class="lang-select" id="peLang">
                      <option value="auto">跟随输入</option>
                      <option value="zh">简体中文</option>
                      <option value="en">English</option>
                      <option value="both">中英双语</option>
                    </select>
                  </label>
                  <label class="pe-field"><span>详细度</span>
                    <select class="lang-select" id="peDetail">
                      <option value="concise">简洁</option>
                      <option value="standard" selected>标准</option>
                      <option value="detailed">详尽</option>
                    </select>
                  </label>
                </div>
                <div class="pe-role-custom" id="peRoleCustomWrap" hidden>
                  <input class="input" id="peRoleCustom" maxlength="60" placeholder="输入自定义角色，例如：资深安全审计员">
                </div>
              </details>

              <details class="pe-more">
                <summary>更多选项（目标读者 / 额外约束 / 示例）</summary>
                <label class="pe-field"><span>目标读者（可选）</span><input class="input" id="peAudience" maxlength="200" placeholder="例如：刚入行的开发者"></label>
                <label class="pe-field"><span>额外约束（可选，每行一条）</span><textarea class="pe-mini" id="peConstraints" maxlength="500" spellcheck="false" placeholder="例如：不要使用第三方库&#10;必须兼容 Windows"></textarea></label>
                <label class="pe-field"><span>期望示例（可选）</span><textarea class="pe-mini" id="peExamples" maxlength="1000" spellcheck="false" placeholder="粘贴一段你希望的语气或结构示例"></textarea></label>
              </details>
              <div class="pe-foot">
                <div class="pe-ai">
                  <button class="switch" id="peAI" type="button" role="switch" aria-checked="false" title="用 AI 润色"></button>
                  <span>用 AI 润色</span>
                  <span class="pe-ai-hint" id="peAIHint">内容将发送到你配置的 AI 接口</span>
                  <button class="pe-link" id="peAISetup" type="button" hidden>去设置</button>
                </div>
                <button class="btn btn-ghost" id="peClear" type="button">清空</button>
                <button class="btn btn-primary" id="peEnhance" type="button"><svg class="ic"><use href="#i-zap"/></svg>增强提示词</button>
              </div>
            </div>
          </article>

          <!-- 更多工具 -->
          <div class="col-12 tool-grid">
            <button class="tool-tile" id="tool-ts"><span class="tt-ic"><svg class="ic"><use href="#i-clock"/></svg></span><span class="tt-name">时间戳转换</span><span class="tt-desc">Unix 时间戳与可读日期互转</span></button>
            <button class="tool-tile" id="tool-qr"><span class="tt-ic"><svg class="ic"><use href="#i-qr"/></svg></span><span class="tt-name">二维码生成</span><span class="tt-desc">文本 / 链接 / Wi-Fi 二维码</span></button>
            <button class="tool-tile" id="tool-unit"><span class="tt-ic"><svg class="ic"><use href="#i-sliders"/></svg></span><span class="tt-name">单位换算</span><span class="tt-desc">长度 / 温度 / 容量 / 速率</span></button>
            <button class="tool-tile" id="tool-color"><span class="tt-ic"><svg class="ic"><use href="#i-palette"/></svg></span><span class="tt-name">颜色转换</span><span class="tt-desc">HEX / RGB / HSL 互转与取色</span></button>
            <button class="tool-tile" id="tool-b64"><span class="tt-ic"><svg class="ic"><use href="#i-code"/></svg></span><span class="tt-name">Base64 编解码</span><span class="tt-desc">文本与 Base64 双向转换</span></button>
            <button class="tool-tile" id="tool-json"><span class="tt-ic"><svg class="ic"><use href="#i-code"/></svg></span><span class="tt-name">JSON 格式化</span><span class="tt-desc">校验 · 美化 · 压缩</span></button>
            <button class="tool-tile soon"><span class="flag-soon">即将上线</span><span class="tt-ic"><svg class="ic"><use href="#i-note"/></svg></span><span class="tt-name">文本对比</span><span class="tt-desc">两段文本差异高亮对比</span></button>
          </div>
        </div>
      </section>
