      <!-- ==================== 视图：密码保险库 ==================== -->
      <section class="view" data-view="vault" id="vaultView">
        <div class="view-head">
          <div>
            <h2 class="vh-title">密码保险库</h2>
            <div class="vh-sub">端到端加密 · 同一网站可保存多个账号 · 分类与凭据均在浏览器加密</div>
          </div>
          <div class="vh-actions">
            <button class="btn btn-primary btn-sm" id="vaultNew"><svg class="ic"><use href="#i-plus"/></svg>新增凭据</button>
          </div>
        </div>

        <div class="vault-wrap" id="vaultWrap">
          <div class="lock-panel">
            <div class="lock-ic"><svg class="ic"><use href="#i-lock"/></svg></div>
            <h3 class="lock-title">保险库已锁定</h3>
            <p class="lock-sub">输入主密码解锁。连续 5 次错误将冻结 10 分钟并通知管理员。</p>
            <div class="lock-form">
              <div class="input-wrap">
                <svg class="ic"><use href="#i-key"/></svg>
                <input class="input" type="password" id="masterPass" placeholder="主密码" autocomplete="new-password">
              </div>
              <div class="input-wrap" id="masterPass2Wrap" hidden>
                <svg class="ic"><use href="#i-key"/></svg>
                <input class="input" type="password" id="masterPass2" placeholder="再次输入主密码（首次设置）">
              </div>
              <button class="btn btn-primary" id="unlockBtn"><svg class="ic"><use href="#i-shield"/></svg>解锁</button>
            </div>
            <div class="lock-hint"><svg class="ic"><use href="#i-shield"/></svg>零知识架构 · 服务端无法读取你的任何密码</div>
          </div>

          <div class="vault-body">
            <div class="bm-layout vault-layout">
              <div class="tabs bm-cat-list vault-cat-list" id="vaultCats"></div>
              <div class="vault-main">
                <div class="vault-main-head">
                  <h3 class="card-title" id="vaultTitle">全部凭据</h3>
                  <span class="chip success" id="vaultCount">0 条</span>
                  <select class="lang-select" id="vaultSort" title="凭据排序" aria-label="凭据排序">
                    <option value="manual">手动排序</option>
                    <option value="added">按加入时间</option>
                    <option value="updated">按更新时间</option>
                    <option value="name">按凭据名称</option>
                  </select>
                  <div class="sec-banner vault-sec">
                    <svg class="ic"><use href="#i-shield"/></svg>AES-256-GCM
                  </div>
                </div>
                <div class="bm-grid vault-grid" id="vaultItems">
                  <div style="grid-column:1/-1;font-size:12px;color:var(--om-text-3);padding:24px 0;text-align:center">解锁后展示凭据卡片</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bm-batch" id="vaultBatch" hidden>
          <span class="bm-batch-n num" id="vaultBatchN">已选 0 个</span>
          <span class="bm-batch-hint" id="vaultBatchHint">拖到左侧分类可归类，拖到此条可删除</span>
          <button class="btn btn-sm danger" id="vaultBatchDel"><svg class="ic"><use href="#i-trash"/></svg>删除</button>
          <button class="btn btn-ghost btn-sm" id="vaultBatchClear">取消选择</button>
        </div>
      </section>
